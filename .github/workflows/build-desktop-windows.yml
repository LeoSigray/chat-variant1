name: Build Windows GUI client

on:
  push:
  workflow_dispatch:

jobs:
  build-gui:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check -r desktop/requirements.txt pyinstaller

      - name: Test desktop client logic
        run: |
          python tests/test_desktop_arduino.py
          python tests/test_desktop_endpoint.py
          node tests/test_graph_math.js

      - name: Build client.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name client `
            --add-data "desktop/ui;ui" `
            --add-data "desktop/assets;assets" `
            --collect-all webview `
            desktop/chat_app.py

      - name: Smoke test GUI executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\client.exe -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            throw "client.exe closed during startup (exit code $($process.ExitCode))"
          }
          Stop-Process -Id $process.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: chat-client-gui-windows
          path: dist/client.exe
